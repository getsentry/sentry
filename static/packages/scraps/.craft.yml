minVersion: '2.21.0'
releaseBranchPrefix: scraps/release
postReleaseCommand: ''
changelog:
  filePath: CHANGELOG.md
  policy: simple
statusProvider:
  name: github
  config:
    contexts:
      - scraps-package-verify
artifactProvider:
  name: github
  config:
    artifacts:
      Scraps package:
        - scraps-tarball
targets:
  - name: github
    tagPrefix: scraps-v
  - name: npm
    access: public
versioning:
  policy: manual
