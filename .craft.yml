minVersion: '3.3.0'
workspaces:
  sentry:
    preReleaseCommand: bash scripts/bump-version.sh
    releaseBranchPrefix: releases
    changelog:
      filePath: CHANGES
      policy: auto
      # Files outside every workspace (src/, tests/, root config) belong to
      # this changelog only, not to the static/packages/* changelogs.
      unownedPaths: own
      # Craft treats pnpm workspace directories as separately owned and drops
      # their commits from this changelog unless they are listed here.
      includePaths:
        - api-docs
        - static/app
        - static/gsAdmin
        - static/gsApp
        - tests/js
    statusProvider:
      name: github
      config:
        contexts:
          - 'self-hosted-ubuntu-24.04-amd64'
          - 'self-hosted-ubuntu-24.04-arm-arm64'
          - 'assemble'
    artifactProvider:
      name: none
    targets:
      - name: github
      - id: release
        name: docker
        source: ghcr.io/getsentry/sentry
        target: ghcr.io/getsentry/sentry
      - id: latest
        name: docker
        source: ghcr.io/getsentry/sentry
        target: ghcr.io/getsentry/sentry
        targetFormat: '{{{target}}}:latest'
    versioning:
      policy: calver
  static/packages/*:
    releaseBranchPrefix: '{{workspaceName}}/release'
    changelog:
      policy: auto
    statusProvider:
      name: github
      config:
        contexts:
          - '{{workspaceName}}-package-pack'
    artifactProvider:
      name: github
      config:
        artifacts:
          Package pack:
            - '{{workspaceName}}-tarball'
    targets:
      - name: github
        tagPrefix: '{{workspaceName}}@'
      - name: npm
        access: public
    versioning:
      policy: auto
