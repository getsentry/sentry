name: Bump @sentry/api in sentry-docs and toolkit

# Each published api@ release asks sentry-docs and getsentry/toolkit to pin the
# new @sentry/api version. Craft publishes to npm before it publishes the
# GitHub release, but the registry can lag, so the dispatches wait until npm
# serves the new version.
on:
  release:
    types:
      - published

# The dispatches use the app tokens below, not GITHUB_TOKEN.
permissions: {}

jobs:
  wait-for-npm:
    if: startsWith(github.event.release.tag_name, 'api@')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts/wait-for-api-release-on-npm.sh
          sparse-checkout-cone-mode: false

      - name: Wait for the release on npm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: .github/workflows/scripts/wait-for-api-release-on-npm.sh "$RELEASE_TAG"

  dispatch:
    needs: wait-for-npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTRY_API_SCHEMA_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_API_SCHEMA_UPDATER_PRIVATE_KEY }}
          owner: getsentry
          repositories: sentry-docs
          permission-actions: write

      # Dispatch by file name: the workflow's display name has changed before.
      - name: Dispatch the sentry-docs bump
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run bump-api-schema-sha.yml --repo getsentry/sentry-docs --ref master

  # toolkit's bump-sentry-api.yml keeps one PR on the newest release, so its CI
  # checks the CLI and MCP packages against each release as it ships.
  dispatch-toolkit:
    needs: wait-for-npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
          owner: getsentry
          repositories: toolkit
          permission-actions: write

      - name: Dispatch the toolkit bump
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run bump-sentry-api.yml --repo getsentry/toolkit --ref main
