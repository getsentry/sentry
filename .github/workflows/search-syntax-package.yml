name: Search syntax package

on:
  push:
    branches:
      - 'search-syntax/release/**'

jobs:
  pack:
    name: search-syntax-package-pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack release artifact
        working-directory: static/packages/search-syntax
        run: pnpm pack --pack-destination .artifacts
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-syntax-tarball
          path: static/packages/search-syntax/.artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
