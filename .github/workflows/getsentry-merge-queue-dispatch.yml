# Dispatches getsentry backend tests for a merge group.
#
# workflow_run always runs this file and the scripts from master, so code in
# the merge group never runs with the getsentry token. Only GitHub-set fields
# of the triggering run (event, head branch, head SHA) are read from it.
name: getsentry merge queue dispatcher

on:
  workflow_run:
    workflows: ['getsentry merge queue trigger']
    types: [requested]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.event == 'merge_group'
    name: getsentry merge queue dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Get changed files for selective testing
        id: changed-files
        env:
          MERGE_GROUP_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: .github/workflows/scripts/getsentry-merge-group-changed-files.sh >> "$GITHUB_OUTPUT"

      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          base: ${{ steps.changed-files.outputs.base-sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: .github/file-filters.yml

      - name: getsentry token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: getsentry
        with:
          client-id: ${{ vars.SENTRY_INTERNAL_APP_ID }}
          private-key: ${{ secrets.SENTRY_INTERNAL_APP_PRIVATE_KEY }}
          repositories: |
            sentry
            getsentry

      - name: Dispatch getsentry tests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SENTRY_CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          SENTRY_PREVIOUS_FILENAMES: ${{ steps.changed-files.outputs.previous-filenames }}
        with:
          github-token: ${{ steps.getsentry.outputs.token }}
          script: |
            const { dispatch } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/getsentry-dispatch.js`);
            await dispatch({
              github,
              context,
              core,
              fileChanges: ${{ toJson(steps.changes.outputs) }},
              sentryChangedFiles: process.env.SENTRY_CHANGED_FILES,
              sentryPreviousFilenames: process.env.SENTRY_PREVIOUS_FILENAMES,
            });
