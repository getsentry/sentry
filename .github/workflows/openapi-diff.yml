name: openapi-diff
on:
  pull_request:

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# hack for https://github.com/actions/cache/issues/810#issuecomment-1222550359
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3

jobs:
  check-diff:
    name: (Optional) Shows the difference between the prod and dev schema
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      spec-artifact-id: ${{ steps.upload-spec.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Check for python file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

      - name: Setup sentry env
        uses: ./.github/actions/setup-sentry
        with:
          mode: migrations
        if: steps.changes.outputs.api_docs == 'true'

      - name: Checkout getsentry/sentry-api-schema
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        if: steps.changes.outputs.api_docs == 'true'
        with:
          ref: 'main'
          repository: getsentry/sentry-api-schema
          path: sentry-api-schema

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build OpenAPI Derefed JSON
        if: steps.changes.outputs.api_docs == 'true'
        run: |
          make build-api-docs

      - name: Upload OpenAPI Derefed JSON
        id: upload-spec
        if: steps.changes.outputs.api_docs == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-derefed
          path: tests/apidocs/openapi-derefed.json
          retention-days: 1

      - name: Compare OpenAPI Derefed JSON
        if: steps.changes.outputs.api_docs == 'true'
        run: |
          npx json-diff@0.5.4 --color sentry-api-schema/openapi-derefed.json tests/apidocs/openapi-derefed.json

      - name: Dump RPC schema for new version
        id: newschema
        if: steps.changes.outputs.api_docs == 'true'
        run: |
          mkdir schemas
          sentry rpcschema --loglevel=WARNING > rpc_method_schema.json

      # Runs oasdiff directly from the getsentry/image-mirror copy instead of
      # oasdiff/oasdiff-action, which builds FROM tufin/oasdiff:main on Docker Hub.
      - name: Output RPC schema comparison
        if: steps.changes.outputs.api_docs == 'true'
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            ghcr.io/getsentry/image-mirror-tufin-oasdiff:v1.33.0 \
            breaking sentry-api-schema/rpc_method_schema.json ./rpc_method_schema.json \
            --fail-on WARN --format githubactions

  # getsentry/sentry-api-schema publishes this schema as @sentry/api. Build it
  # here so a schema change that breaks the client fails on the PR rather than
  # on sentry-api-schema's main branch after merge.
  client-build:
    name: (Optional) Builds the @sentry/api client from the dev schema
    needs: check-diff
    if: ${{ !cancelled() && needs.check-diff.outputs.spec-artifact-id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sentry-api-schema
    steps:
      - name: Checkout getsentry/sentry-api-schema
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: 'main'
          repository: getsentry/sentry-api-schema
          path: sentry-api-schema

      - name: Download OpenAPI Derefed JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openapi-derefed
          path: sentry-api-schema

      # Node 22 is the oldest version @sentry/api supports, and the version its
      # release artifact is built with.
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@9b5745cdf0a2e8c2620f0746130f809adb911c19 # v4
        with:
          package_json_file: sentry-api-schema/package.json
          cache: true
          cache_dependency_path: sentry-api-schema/pnpm-lock.yaml

      # The same steps as sentry-api-schema's Build workflow.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test
