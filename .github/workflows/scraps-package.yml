name: Scraps package

on:
  pull_request:
    paths:
      - '.craft.yml'
      - 'static/packages/scraps/**'
      - 'static/packages/icons/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/scraps-package.yml'
  push:
    branches:
      - master
      - 'scraps/release/**'
  workflow_dispatch:

jobs:
  icons:
    name: icons-package-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @sentry/icons typecheck
      - run: pnpm --filter @sentry/icons test --ci --maxWorkers=2
      - run: pnpm --filter @sentry/icons verify
  verify:
    name: scraps-package-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir static/packages/scraps verify
      - name: Pack release artifact
        if: startsWith(github.ref, 'refs/heads/scraps/release/')
        working-directory: static/packages/scraps
        run: pnpm pack --pack-destination .artifacts
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/heads/scraps/release/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scraps-tarball
          path: static/packages/scraps/.artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
