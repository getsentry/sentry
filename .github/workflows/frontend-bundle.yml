name: frontend-bundle

# Builds the SaaS frontend bundle for every master commit and publishes it to
# GCS keyed by SHA. getsentry looks it up by its pinned sentry-version: the
# backend image extracts frontend-bundle.tar.gz and the GoCD frontend pipeline
# deploys configmap.json.
on:
  push:
    branches:
      - master

env:
  # hack for https://github.com/actions/cache/issues/810#issuecomment-1222550359
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
  NODE_OPTIONS: '--max-old-space-size=4096'
  FRONTEND_BUNDLE_BUCKET: getsentry-frontend-bundles
  STATIC_BUCKET: sentryio-static

jobs:
  frontend-bundle:
    if: github.repository == 'getsentry/sentry'
    name: frontend bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version-file: '.node-version'

      - uses: pnpm/action-setup@9b5745cdf0a2e8c2620f0746130f809adb911c19 # v4

      - uses: ./.github/actions/node-modules-cache-paths
        id: workspace-cache

      # Production-only install, like the image builds; keyed separately from
      # the dev install used by frontend.yml.
      - name: node_modules cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: nodemodulescache
        with:
          path: ${{ steps.workspace-cache.outputs.paths }}
          key: ${{ runner.os }}-${{ runner.arch }}-frontend-bundle-node-modules-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.node-version') }}

      - name: Install Javascript Dependencies
        if: steps.nodemodulescache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --production

      # The checksum comes from
      # https://release-registry.services.sentry.io/apps/sentry-cli/<version>
      - name: Install sentry-cli
        env:
          SENTRY_CLI_VERSION: 2.17.2
          SENTRY_CLI_SHA256: 18bfbae6c184d976d30f54375815fabe6cfb4e6b7786298bc56f4f1c76a96c2c
        run: |
          bin="${RUNNER_TEMP}/sentry-cli-bin"
          mkdir -p "${bin}"
          curl -fsSL -o "${bin}/sentry-cli" \
            "https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  ${bin}/sentry-cli" | sha256sum -c -
          chmod +x "${bin}/sentry-cli"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Build
        env:
          NODE_ENV: production
          SENTRY_RELEASE_VERSION: frontend@${{ github.sha }}
        run: |
          pnpm run build-production
          pnpm run build-chartcuterie-config

      - name: Package
        env:
          COMMIT_SHA: ${{ github.sha }}
          OUT: ${{ runner.temp }}/frontend-bundle
          SENTRY_AUTH_TOKEN: ${{ secrets.FRONTEND_BUNDLE_SENTRY_AUTH_TOKEN }}
        run: ./.github/workflows/scripts/frontend-bundle/prepare.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.3
        with:
          project_id: sentry-dev-tooling
          workload_identity_provider: ${{ secrets.SENTRY_GCP_DEV_WORKLOAD_IDENTITY_POOL }}
          service_account: ${{ secrets.FRONTEND_BUNDLE_SERVICE_ACCOUNT_EMAIL }}

      - name: Upload
        env:
          COMMIT_SHA: ${{ github.sha }}
          OUT: ${{ runner.temp }}/frontend-bundle
          CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: 'False'
        run: ./.github/workflows/scripts/frontend-bundle/upload.sh
