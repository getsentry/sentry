name: frontend-bundle

# Builds the SaaS frontend bundle for every master commit, uploads it as a
# workflow artifact, and dispatches getsentry's frontend-bundle workflow to
# publish it. This repo holds no cloud or Sentry credentials for the bundle:
# getsentry uploads the sourcemaps and publishes to the CDN and GCS.
on:
  push:
    branches:
      - master

env:
  # hack for https://github.com/actions/cache/issues/810#issuecomment-1222550359
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  frontend-bundle:
    if: github.repository == 'getsentry/sentry'
    name: frontend bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version-file: '.node-version'

      - uses: pnpm/action-setup@9b5745cdf0a2e8c2620f0746130f809adb911c19 # v4

      - uses: ./.github/actions/node-modules-cache-paths
        id: workspace-cache

      # Production-only install, like the image builds; keyed separately from
      # the dev install used by frontend.yml.
      - name: node_modules cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: nodemodulescache
        with:
          path: ${{ steps.workspace-cache.outputs.paths }}
          key: ${{ runner.os }}-${{ runner.arch }}-frontend-bundle-node-modules-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.node-version') }}

      - name: Install Javascript Dependencies
        if: steps.nodemodulescache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --production

      # The checksum comes from
      # https://release-registry.services.sentry.io/apps/sentry-cli/<version>
      - name: Install sentry-cli
        env:
          SENTRY_CLI_VERSION: 2.17.2
          SENTRY_CLI_SHA256: 18bfbae6c184d976d30f54375815fabe6cfb4e6b7786298bc56f4f1c76a96c2c
        run: |
          bin="${RUNNER_TEMP}/sentry-cli-bin"
          mkdir -p "${bin}"
          curl -fsSL -o "${bin}/sentry-cli" \
            "https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  ${bin}/sentry-cli" | sha256sum -c -
          chmod +x "${bin}/sentry-cli"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Build
        env:
          NODE_ENV: production
          SENTRY_RELEASE_VERSION: frontend@${{ github.sha }}
        run: |
          pnpm run build-production
          pnpm run build-chartcuterie-config

      - name: Package
        env:
          COMMIT_SHA: ${{ github.sha }}
          OUT: ${{ runner.temp }}/frontend-bundle
        run: ./.github/workflows/scripts/frontend-bundle/prepare.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-bundle
          path: ${{ runner.temp }}/frontend-bundle
          if-no-files-found: error
          retention-days: 30

  # A separate job so the dispatch token never shares a runner with the
  # third-party code that the build installs and runs.
  publish:
    if: github.repository == 'getsentry/sentry'
    needs: frontend-bundle
    name: dispatch getsentry publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: getsentry token
        id: getsentry
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SENTRY_INTERNAL_APP_ID }}
          private-key: ${{ secrets.SENTRY_INTERNAL_APP_PRIVATE_KEY }}
          repositories: |
            getsentry
          permission-actions: write

      # getsentry doesn't trust these inputs: it checks through the API that
      # the run is a master push of this workflow for this SHA before
      # publishing anything.
      - name: Dispatch getsentry frontend-bundle
        env:
          GH_TOKEN: ${{ steps.getsentry.outputs.token }}
        run: |
          gh workflow run frontend-bundle.yml \
            --repo getsentry/getsentry \
            --ref master \
            -f sentry-sha="${GITHUB_SHA}" \
            -f sentry-run-id="${GITHUB_RUN_ID}"
