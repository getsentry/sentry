name: 'frontend-snapshots'

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  SNAPSHOT_OUTPUT_DIR: .artifacts/snapshots
jobs:
  snapshots:
    name: snapshot tests
    # Skip 'edited' events that aren't a base branch change (e.g. title/body edits).
    # When the base branch changes, the diff target changes so we need a fresh run.
    if: github.event.action != 'edited' || github.event.changes.base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          # Checkout the HEAD of the PR (or the commit if not a PR)
          # Explicitly need to do this to avoid cases where the merge commit is used instead of the PR head,
          # which can introduce diffs that aren't explicitly caused by the PR changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version-file: '.node-version'

      - uses: pnpm/action-setup@36de12bed180fa130ed56a35e7344f2fa7a820ab # v4

      - name: node_modules cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: nodemodulescache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml', 'api-docs/pnpm-lock.yaml', '.node-version') }}

      - name: Install Javascript Dependencies
        if: steps.nodemodulescache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run snapshot tests
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_SNAPSHOTS_DSN }}
          GITHUB_PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_PR_REF: ${{ github.event.pull_request.head.ref || github.ref }}
        run: pnpm run snapshots

      - name: Compute merge base SHA
        if: github.event_name == 'pull_request' && !cancelled()
        id: merge-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MERGE_BASE=$(gh api repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} --jq '.merge_base_commit.sha')
          echo "sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"

      # Serialize the PR/push VCS context for the privileged upload workflow.
      # `sentry-cli snapshots upload` runs in a separate `workflow_run` workflow
      # (frontend-snapshots-upload.yml) so that fork PRs, which don't get
      # secrets on `pull_request`, can still be uploaded. jq -n --arg safely
      # JSON-encodes these attacker-influenced values.
      - name: Write VCS metadata
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO_NAME: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REPO_NAME: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ steps.merge-base.outputs.sha }}
        run: |
          mkdir -p "$SNAPSHOT_OUTPUT_DIR"
          jq -n \
            --arg event_name "$EVENT_NAME" \
            --arg head_sha "$HEAD_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg head_repo_name "$HEAD_REPO_NAME" \
            --arg base_repo_name "$BASE_REPO_NAME" \
            --arg head_ref "$HEAD_REF" \
            --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" \
            '{event_name: $event_name, head_sha: $head_sha, pr_number: $pr_number, head_repo_name: $head_repo_name, base_repo_name: $base_repo_name, head_ref: $head_ref, base_ref: $base_ref, base_sha: $base_sha}' \
            > "$SNAPSHOT_OUTPUT_DIR/../vcs-metadata.json"
          cat "$SNAPSHOT_OUTPUT_DIR/../vcs-metadata.json"

      - name: Upload snapshots artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-snapshots-${{ github.run_id }}
          path: .artifacts
          retention-days: 1
          if-no-files-found: error
          # .artifacts is a dot-directory; without this upload-artifact treats
          # its contents as hidden and uploads nothing.
          include-hidden-files: true
