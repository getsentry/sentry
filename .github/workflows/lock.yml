name: 'lock closed issues/PRs'
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: 15
          issue-lock-reason: ''
          pr-inactive-days: 15
          pr-lock-reason: ''
