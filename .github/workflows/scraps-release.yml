name: Prepare Scraps release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with an entry in packages/scraps/CHANGELOG.md
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version-file: '.node-version'
      - name: Prepare release
        uses: getsentry/craft@5cabbe7d6ae3730788393284d5071969d9309753 # v2
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          path: packages/scraps
          version: ${{ inputs.version }}
          publish_repo: getsentry/publish
