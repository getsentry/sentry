name: decision model lint

# Never pull_request_target, which would give the PR's code the key.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint PR
    # Branches in this repo only, so employees and internal bots but never forks. Every label
    # change re-runs the lint, because a skipped run would replace the last result.
    # Each changed file costs model calls, so mass rewrites such as codemods and formatter
    # sweeps are skipped. Removed lines are not linted, so only additions count. Over 99.8% of
    # merged PRs fall under both limits.
    # Dependabot PRs only bump dependencies, so they are not linted. Their runs also read
    # Dependabot secrets instead of Actions secrets, so the key may not be set.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.changed_files <= 200 &&
      github.event.pull_request.additions <= 10000
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The PR's merge commit and its first parent: HEAD^1..HEAD is exactly what the PR changes.
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: $/.github/actions/setup-node-pnpm

      - name: lint
        env:
          OPENROUTER_API_KEY: ${{ secrets.DECISION_MODEL_LINTER_OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          LABEL: 'Trigger: Override Decision Model Lint'
          # Rules diff each file against the PR's base, it must match --base below
          DECISION_MODEL_LINT_BASE: HEAD^1
          OVERRIDDEN: "${{ contains(github.event.pull_request.labels.*.name, 'Trigger: Override Decision Model Lint') }}"
        run: .github/workflows/scripts/run-decision-model-lint.sh
