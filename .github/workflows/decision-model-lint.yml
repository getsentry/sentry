name: decision model lint

# Never pull_request_target, which would give the PR's code the key.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint PR
    # Branches in this repo only, so employees and internal bots but never forks. Every label
    # change re-runs the lint, because a skipped run would replace the last result.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The PR's merge commit and its first parent: HEAD^1..HEAD is exactly what the PR changes.
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: lint
        env:
          OPENROUTER_API_KEY: ${{ secrets.DECISION_MODEL_LINTER_OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          LABEL: 'Trigger: Override Decision Model Lint'
          # Rules diff each file against the PR's base, it must match --base in the script
          DECISION_MODEL_LINT_BASE: HEAD^1
          OVERRIDDEN: "${{ contains(github.event.pull_request.labels.*.name, 'Trigger: Override Decision Model Lint') }}"
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          MAX_FILES: 1000
        run: .github/workflows/scripts/decision-model-lint.sh
