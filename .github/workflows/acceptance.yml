# Also note that this name *MUST* match the filename because GHA
# only provides the workflow name (https://docs.github.com/en/free-pro-team@latest/actions/reference/environment-variables#default-environment-variables)
# and GH APIs only support querying by workflow *FILENAME* (https://developer.github.com/v3/actions/workflows/#get-a-workflow)
name: acceptance
on:
  push:
    branches:
      - master
      - releases/**
  pull_request:
  # Records the per-test coverage that select-tests maps Python changes with.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# hack for https://github.com/actions/cache/issues/810#issuecomment-1222550359
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
  NODE_OPTIONS: '--max-old-space-size=4096'
  CHARTCUTERIE_CONFIG_PATH: ${{ github.workspace }}/config/chartcuterie
  SNUBA_NO_WORKERS: 1
  COLLECT_COVERAGE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  ACCEPTANCE_COVERAGE_DB: .artifacts/acceptance.coverage
  ACCEPTANCE_COVERAGE_CACHE_PREFIX: acceptance-coverage-

jobs:
  files-changed:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: detect what files changed
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-26.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    # Map a step output to a job output
    outputs:
      acceptance: ${{ steps.changes.outputs.acceptance }}
      frontend_all: ${{ steps.changes.outputs.frontend_all }}
      skip_selective_testing: "${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'Trigger: Override Selective Testing') }}"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Check for backend file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  # Pull requests run only the acceptance tests their changes can reach, like
  # backend.yml's select-tests. See compute-acceptance-selected-tests.py for
  # how, and what it can miss. Pushes to master run the whole suite, so a
  # missed test fails there.
  select-tests:
    if: >-
      needs.files-changed.outputs.acceptance == 'true' &&
      needs.files-changed.outputs.skip_selective_testing != 'true' &&
      github.event_name == 'pull_request'
    needs: files-changed
    name: select acceptance tests
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      shard-count: ${{ steps.select.outputs.shard-count }}
      shard-indices: ${{ steps.select.outputs.shard-indices }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Get changed files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            --paginate | python3 .github/workflows/scripts/parse-pr-files.py >> "$GITHUB_OUTPUT"

      # The newest coverage that acceptance-coverage saved on master. The key
      # never matches, so the prefix picks the newest. Without coverage,
      # Python changes run the whole suite.
      - name: Restore acceptance coverage
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.ACCEPTANCE_COVERAGE_DB }}
          key: ${{ env.ACCEPTANCE_COVERAGE_CACHE_PREFIX }}latest
          restore-keys: ${{ env.ACCEPTANCE_COVERAGE_CACHE_PREFIX }}

      - name: Select tests
        id: select
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          PREVIOUS_FILENAMES: ${{ steps.changed.outputs.previous-filenames }}
        run: |
          python3 .github/workflows/scripts/compute-acceptance-selected-tests.py \
            --changed-files "$CHANGED_FILES" \
            --previous-filenames "$PREVIOUS_FILENAMES" \
            --coverage-db "$ACCEPTANCE_COVERAGE_DB" \
            --output .artifacts/acceptance-selected-tests.txt \
            --github-output

      - name: Upload selected tests
        if: steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-selected-tests-${{ github.run_id }}
          path: .artifacts/acceptance-selected-tests.txt
          retention-days: 1

  acceptance:
    # When select-tests is skipped or fails, its outputs are unset and the
    # whole suite runs. An unset output is null, which compares equal to '0',
    # so check selected before shard-count.
    if: >-
      always() && !cancelled() &&
      (needs.files-changed.outputs.acceptance == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      !(needs.select-tests.outputs.selected == 'true' && needs.select-tests.outputs.shard-count == '0')
    needs: [files-changed, select-tests]
    name: acceptance
    # Arm runners on pull requests only; master stays on amd64 for now.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read # used for DIM metadata
    strategy:
      # This helps not having to run multiple jobs because one fails, thus, reducing resource usage
      # and reducing the risk that one of many runs would turn red again (read: intermittent tests)
      fail-fast: false
      matrix:
        # The shards select-tests asks for when it selected tests, otherwise 5. Each
        # shard spends about 2 minutes on setup, so more shards cost far more runner
        # time than they save in wall time.
        instance: ${{ needs.select-tests.outputs.selected == 'true' && fromJSON(needs.select-tests.outputs.shard-indices) || fromJSON('[0, 1, 2, 3, 4]') }}
    env:
      # Must match the length of strategy.matrix.instance.
      MATRIX_INSTANCE_TOTAL: ${{ needs.select-tests.outputs.selected == 'true' && needs.select-tests.outputs.shard-count || '5' }}
      TEST_GROUP_STRATEGY: roundrobin
      PYTHONHASHSEED: '0'
      XDIST_PER_WORKER_SNUBA: '1'
      XDIST_WORKERS: '3'
      # Arm pull requests and x64 master test against the same Chrome build.
      # 156.0.8078.47 is what the x64 image shipped when this was pinned.
      CHROME_FOR_TESTING_VERSION: '156.0.8078.47'
      CHROME_FOR_TESTING_DIR: /home/runner/.cache/chrome-for-testing

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        name: Checkout sentry

      - name: Start resource monitor
        run: python3 .github/workflows/scripts/monitor-resources.py --start

      # devservices bind mounts this into chartcuterie. Create it up front so
      # docker doesn't create it as root before the config module is built.
      # chartcuterie polls for the config file until it shows up.
      - name: Create chartcuterie config directory
        run: mkdir -p "$CHARTCUTERIE_CONFIG_PATH"

      # Must run before "Setup sentry env" starts in the background: it parses
      # $GITHUB_EVENT_PATH, which the runner truncates whenever a step starts,
      # including the background step's inner steps (getsentry/sentry#127566).
      - uses: ./.github/actions/setup-node-toolchain

      # Starts per-worker ClickHouse bootstrap as soon as its dependencies are
      # healthy, instead of after snuba-snuba-1's own bootstrap.
      - name: Start per-worker Snuba bootstrap in the background
        if: env.XDIST_PER_WORKER_SNUBA == '1'
        env:
          DEVSERVICES_STATUS_FILE: ${{ runner.temp }}/devservices-ci/up.exit
        run: python3 .github/workflows/scripts/bootstrap-snuba.py --start

      # The python env and devservices don't depend on the frontend build, so
      # bring them up in the background while webpack runs.
      - name: Setup sentry env
        uses: ./.github/actions/setup-sentry
        id: setup
        background: true
        with:
          mode: acceptance-ci
          early-devservices: 'true'

      - name: Step configurations
        id: config
        run: |
          echo "webpack-path=.webpack_cache" >> "$GITHUB_OUTPUT"
          echo "WEBPACK_CACHE_PATH=.webpack_cache" >> "$GITHUB_ENV"

      - name: webpack cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ steps.config.outputs.webpack-path }}
          key: ${{ runner.os }}-v2-webpack-cache-${{ hashFiles('rsbuild.config.ts', 'pnpm-lock.yaml', 'package.json') }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          setup-toolchain: 'false'

      - name: Chrome for Testing cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.CHROME_FOR_TESTING_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-chrome-for-testing-${{ env.CHROME_FOR_TESTING_VERSION }}

      - name: Install Chrome for Testing
        timeout-minutes: 15
        run: .github/workflows/scripts/install-chrome-for-testing.sh

      # Chrome's first launch on a fresh runner takes several seconds longer
      # than later ones, which is consistent with a cold disk and font cache.
      # Launch it once here, while webpack builds, so the test workers don't
      # pay that.
      - name: Warm up Chrome in the background
        run: |
          if command -v google-chrome && command -v chromedriver; then
            setsid nohup timeout 60 google-chrome --headless --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --user-data-dir="$(mktemp -d)" --window-size=1680,1050 \
              --screenshot="$RUNNER_TEMP/chrome-warmup.png" 'data:text/html,<p>warm</p>' \
              >"$RUNNER_TEMP/chrome-warmup.log" 2>&1 &
            setsid nohup chromedriver --version >/dev/null 2>&1 &
          fi

      - name: webpack
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GH_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm run build-acceptance

      - name: Build chartcuterie configuration module
        run: |
          make build-chartcuterie-config

      - name: Wait for sentry env
        wait: setup

      - name: Bootstrap per-worker Snuba instances
        if: env.XDIST_PER_WORKER_SNUBA == '1'
        run: python3 .github/workflows/scripts/bootstrap-snuba.py --wait

      # See the same step in backend.yml.
      - name: Make the Kafka healthcheck cheap
        continue-on-error: true
        run: |
          real=$(docker exec kafka-kafka-1 sh -c 'command -v kafka-topics')
          docker exec -u 0 kafka-kafka-1 mv "$real" "$real.real"
          docker cp .github/workflows/scripts/kafka-topics-healthcheck.sh "kafka-kafka-1:$real"
          time docker exec kafka-kafka-1 kafka-topics --bootstrap-server 127.0.0.1:9092 --list

      - name: Download selected tests
        if: needs.select-tests.outputs.selected == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acceptance-selected-tests-${{ github.run_id }}
          path: .artifacts/

      - name: Run acceptance tests (#${{ steps.setup.outputs.matrix-instance-number }} of ${{ steps.setup.outputs.matrix-instance-total }})
        env:
          SELECTED_TESTS_FILE: ${{ needs.select-tests.outputs.selected == 'true' && '.artifacts/acceptance-selected-tests.txt' || '' }}
          # Per-test coverage for select-tests. acceptance_coverage_warmup.py
          # explains the plugin.
          ACCEPTANCE_COVERAGE_ARGS: ${{ env.COLLECT_COVERAGE == 'true' && '-p acceptance_coverage_warmup --cov=src --cov-context=test --cov-report=' || '' }}
          PYTHONPATH: ${{ env.COLLECT_COVERAGE == 'true' && format('{0}/.github/workflows/scripts', github.workspace) || '' }}
          COVERAGE_FILE: ${{ github.workspace }}/${{ env.ACCEPTANCE_COVERAGE_DB }}
        run: |
          export PYTEST_ADDOPTS="$PYTEST_ADDOPTS -n ${XDIST_WORKERS} --dist=loadfile"
          # Pins the Chrome for Testing build, not the image's Chrome, and skips
          # the Selenium Manager lookup Selenium would run on every launch.
          chrome=$(command -v google-chrome)
          chromedriver=$(command -v chromedriver)
          PYTEST_ADDOPTS="$PYTEST_ADDOPTS --chrome-path=$chrome --chromedriver-path=$chromedriver $ACCEPTANCE_COVERAGE_ARGS"
          timeout -k 30 1200 make run-acceptance || rc=$?
          [ "${rc:-0}" -ne 124 ] || echo "::error::Test run timed out after 20 minutes (possible xdist hang)"
          exit "${rc:-0}"

      - name: Upload acceptance coverage
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-coverage-shard-${{ matrix.instance }}
          path: ${{ env.ACCEPTANCE_COVERAGE_DB }}
          if-no-files-found: error
          retention-days: 1

      - name: Stop resource monitor
        if: always()
        continue-on-error: true
        run: python3 .github/workflows/scripts/monitor-resources.py --stop

      - name: Upload resource usage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-resource-usage-${{ github.run_id }}-${{ matrix.instance }}
          path: |
            .artifacts/resource-usage.jsonl
            .artifacts/resource-usage-summary.json
          retention-days: 30

      - name: Inspect failure
        if: failure()
        run: |
          if command -v devservices; then
            devservices logs
          fi

          if [ "${XDIST_PER_WORKER_SNUBA}" = "1" ]; then
            for i in $(seq 0 $(( ${XDIST_WORKERS} - 1 ))); do
              echo "--- snuba-gw${i} logs ---"
              docker logs "snuba-gw${i}" 2>&1 | tail -30 || true
            done
          fi

  # Only after every shard passed and uploaded its coverage, so the combined
  # coverage includes every test. A failing day keeps the previous coverage.
  acceptance-coverage:
    if: >-
      needs.acceptance.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: acceptance
    name: combine acceptance coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Must match uv.lock, so the data files are in a format it can read.
      COVERAGE_VERSION: '7.6.4'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: acceptance-coverage-shard-*
          path: .artifacts/shards

      - uses: astral-sh/setup-uv@884ad927a57e558e7a70b92f2bccf9198a4be546 # v6
        with:
          version: '0.13.7'
          enable-cache: false

      # --rcfile: setup.cfg names coverage plugins that only the sentry venv has.
      - name: Combine shard coverage
        run: uvx --from "coverage==$COVERAGE_VERSION" coverage combine --rcfile=/dev/null --data-file="$ACCEPTANCE_COVERAGE_DB" .artifacts/shards/*/acceptance.coverage

      # select-tests restores the newest of these.
      - name: Save acceptance coverage
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.ACCEPTANCE_COVERAGE_DB }}
          key: ${{ env.ACCEPTANCE_COVERAGE_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}

  acceptance-required-checks:
    # this is a required check so we need this job to always run and report a status.
    if: always()
    name: Acceptance
    needs: [acceptance, files-changed]
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-26.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 3
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the dependent jobs have failed. You may need to re-run it." && exit 1
