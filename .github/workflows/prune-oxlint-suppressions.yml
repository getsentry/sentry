name: Prune oxlint suppressions

on:
  workflow_call:
    secrets:
      SENTRY_RELEASE_BOT_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prune-oxlint-suppressions
  cancel-in-progress: false

jobs:
  prune:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: master
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Prune suppression budgets
        run: pnpm run lint:js --prune

      - name: Get release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish cleanup pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: bot/prune-oxlint-suppressions
          base: master
          add-paths: oxlint-suppressions.json
          commit-message: 'chore(lint): prune oxlint suppressions'
          title: 'chore(lint): prune oxlint suppressions'
          body: 'Reduce stale oxlint suppression budgets using a full type-aware scan of master. Generated by `pnpm run lint:js --prune`; existing budgets cannot increase.'
