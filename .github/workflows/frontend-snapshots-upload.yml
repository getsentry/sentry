name: 'frontend-snapshots-upload'

# Uploads the snapshots generated by `frontend-snapshots.yml` to Sentry.
#
# This runs as a `workflow_run` workflow, separate from the build, so that fork
# PRs work: GitHub withholds repository secrets from `pull_request` runs raised
# by a fork, but a `workflow_run` workflow executes from the default branch with
# access to secrets. It only consumes the already-rendered PNGs + VCS metadata
# produced by the build — it never checks out or executes PR code — so the auth
# token is never exposed to untrusted code.
on:
  workflow_run:
    workflows: ['frontend-snapshots']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  SNAPSHOT_OUTPUT_DIR: .artifacts/snapshots

jobs:
  upload:
    name: upload snapshots
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download snapshots artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-snapshots-${{ github.event.workflow_run.id }}
          path: .artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=3.5.0 sh

      # head_sha, head_repo_name, head_ref, and base_repo_name are taken from the
      # trusted `workflow_run` event — GitHub sets these from the run that
      # actually triggered this workflow, so a fork cannot forge them. They are
      # deliberately NOT read from the artifact: a fork controls the build
      # workflow's file and could otherwise spoof commit/PR attribution (the
      # backend posts the check-run against head_sha). Only pr_number, base_sha,
      # and base_ref — which aren't available on the workflow_run event — are
      # read from the (untrusted) artifact; pr_number is validated numeric and
      # never interpolated into the script.
      - name: Upload snapshots
        id: upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SNAPSHOTS_AUTH_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO_NAME: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          BASE_REPO_NAME: ${{ github.repository }}
        run: |
          META="$SNAPSHOT_OUTPUT_DIR/../vcs-metadata.json"
          PR_NUMBER=$(jq -r '.pr_number // ""' "$META")
          BASE_REF=$(jq -r '.base_ref // ""' "$META")
          BASE_SHA=$(jq -r '.base_sha // ""' "$META")

          if [ -n "$PR_NUMBER" ] && ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "Refusing to upload: pr_number is not numeric: $PR_NUMBER" >&2
            exit 1
          fi

          args=(snapshots upload "$SNAPSHOT_OUTPUT_DIR" \
            --app-id sentry-frontend \
            --project sentry-frontend \
            --vcs-provider github)
          [ -n "$HEAD_SHA" ] && args+=(--head-sha "$HEAD_SHA")
          [ -n "$HEAD_REPO_NAME" ] && args+=(--head-repo-name "$HEAD_REPO_NAME")
          [ -n "$BASE_REPO_NAME" ] && args+=(--base-repo-name "$BASE_REPO_NAME")
          [ -n "$HEAD_REF" ] && args+=(--head-ref "$HEAD_REF")
          [ -n "$BASE_REF" ] && args+=(--base-ref "$BASE_REF")
          [ -n "$BASE_SHA" ] && args+=(--base-sha "$BASE_SHA")
          # --pr-number requires --base-sha or sentry-cli bails.
          if [ -n "$PR_NUMBER" ] && [ -n "$BASE_SHA" ]; then
            args+=(--pr-number "$PR_NUMBER")
          fi

          sentry-cli --log-level=debug "${args[@]}"

      - name: Report upload failure to Sentry
        if: ${{ failure() && steps.upload.outcome == 'failure' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_SNAPSHOTS_DSN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sentry-cli send-event \
            --message "Frontend snapshot upload failed" \
            --tag workflow:frontend-snapshots-upload \
            --tag commit:"$COMMIT_SHA"
