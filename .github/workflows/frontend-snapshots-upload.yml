name: 'frontend-snapshots-upload'

# Uploads the snapshots built by `frontend-snapshots.yml` to Sentry.
#
# Runs as a `workflow_run` workflow so fork PRs work: GitHub withholds secrets
# from fork `pull_request` runs, but `workflow_run` executes from the default
# branch with secrets. It only consumes the rendered PNGs + metadata — it never
# checks out or runs PR code — so the token is never exposed to untrusted code.
on:
  workflow_run:
    workflows: ['frontend-snapshots']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  SNAPSHOT_OUTPUT_DIR: .artifacts/snapshots
  VCS_METADATA_FILE: .artifacts/vcs-metadata.json

jobs:
  upload:
    name: upload snapshots
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download snapshots artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-snapshots-${{ github.event.workflow_run.id }}
          path: .artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION=3.5.0 sh

      # head_sha, head_ref and base_repo_name come from the trusted workflow_run
      # event so a fork can't forge them; head_sha in particular anchors the
      # check-run to the real PR head commit. pr_number/base_sha/base_ref (not on
      # the event) and head_repo_name (event value is null for many forks) come
      # from the artifact; pr_number is validated numeric and no artifact value
      # is ever interpolated into the script.
      - name: Upload snapshots
        id: upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SNAPSHOTS_AUTH_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO_NAME_TRUSTED: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          BASE_REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -r '.pr_number // ""' "$VCS_METADATA_FILE")
          BASE_REF=$(jq -r '.base_ref // ""' "$VCS_METADATA_FILE")
          BASE_SHA=$(jq -r '.base_sha // ""' "$VCS_METADATA_FILE")

          # Prefer the trusted event value; fall back to the artifact when
          # head_repository is null (common for forks). Safe because head_sha is
          # trusted, so a spoofed head_repo_name can't redirect the check-run.
          HEAD_REPO_NAME="$HEAD_REPO_NAME_TRUSTED"
          if [ -z "$HEAD_REPO_NAME" ]; then
            HEAD_REPO_NAME=$(jq -r '.head_repo_name // ""' "$VCS_METADATA_FILE")
          fi

          if [ -n "$PR_NUMBER" ] && ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "Refusing to upload: pr_number is not numeric: $PR_NUMBER" >&2
            exit 1
          fi

          args=(snapshots upload "$SNAPSHOT_OUTPUT_DIR" \
            --app-id sentry-frontend \
            --project sentry-frontend \
            --vcs-provider github)
          [ -n "$HEAD_SHA" ] && args+=(--head-sha "$HEAD_SHA")
          [ -n "$HEAD_REPO_NAME" ] && args+=(--head-repo-name "$HEAD_REPO_NAME")
          [ -n "$BASE_REPO_NAME" ] && args+=(--base-repo-name "$BASE_REPO_NAME")
          [ -n "$HEAD_REF" ] && args+=(--head-ref "$HEAD_REF")
          [ -n "$BASE_REF" ] && args+=(--base-ref "$BASE_REF")
          [ -n "$BASE_SHA" ] && args+=(--base-sha "$BASE_SHA")
          # --pr-number requires --base-sha or sentry-cli bails.
          if [ -n "$PR_NUMBER" ] && [ -n "$BASE_SHA" ]; then
            args+=(--pr-number "$PR_NUMBER")
          fi

          sentry-cli --log-level=debug "${args[@]}"

      - name: Report upload failure to Sentry
        if: ${{ failure() && steps.upload.outcome == 'failure' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_SNAPSHOTS_DSN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sentry-cli send-event \
            --message "Frontend snapshot upload failed" \
            --tag workflow:frontend-snapshots-upload \
            --tag commit:"$COMMIT_SHA"
