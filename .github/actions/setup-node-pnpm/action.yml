name: 'Setup Node and pnpm'
description: 'Sets up Node.js, pnpm, and caches node_modules'
inputs:
  setup-toolchain:
    description: >-
      Install Node.js and pnpm. Set to 'false' when the job already ran
      ./.github/actions/setup-node-toolchain, so this action can run inside a
      `parallel:` group or alongside a `background:` step.
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup-node-toolchain
      if: inputs.setup-toolchain == 'true'

    - uses: ./.github/actions/node-modules-cache-paths
      id: workspace-cache

    - name: node_modules cache
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      id: nodemodulescache
      with:
        path: ${{ steps.workspace-cache.outputs.paths }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.node-version') }}

    - name: Install Javascript Dependencies
      if: steps.nodemodulescache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
