[flake8]
# Flake8 is now ONLY used for custom Sentry S* rules.
# All other linting (E, W, F, B, LOG, I) is handled by ruff.
# See [tool.ruff] in pyproject.toml for the main linting configuration.
select = S
per-file-ignores =
    # these scripts must have minimal dependencies so opt out of the usual sentry rules
    .github/*: S
    devenv/*.py: S
    src/sentry/build/*: S
    tools/*: S
    # testing the options manager itself
    src/sentry/testutils/helpers/options.py, tests/sentry/options/test_manager.py, tests/sentry/options/test_update_channels.py, tests/sentry/runner/commands/test_configoptions.py: S011
    # session setup, a fake settings object, and a script run in a subprocess
    src/sentry/testutils/pytest/sentry.py, tests/sentry/runner/test_initializer.py, tests/sentry/test_devimports.py: S031
    # S021-S028 and S034 lint the shipped API surface and its lint infrastructure; test
    # modules deliberately contain the shapes they exercise
    tests/*: S021, S022, S023, S024, S025, S026, S027, S028, S034

[flake8:local-plugins]
paths = .
extension =
    S=tools.flake8_plugin:SentryCheck

[coverage:run]
omit =
    src/sentry/migrations/*
plugins =
    covdefaults
    sentry_covdefaults_disable_branch_coverage

[coverage:report]
# Setting this to 0 makes it falsy, and it gets ignored, so we set it to
# a value we'll never fall below. (0 is the default, but it's changed to 100 by
# covdefaults, so this just changes it back.)
fail_under = 0.01
