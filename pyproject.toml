[project]
name = "sentry"
# see setup.cfg for versioning; we only have this here to make uv happy
# which we intend to use for dependency management, not packaging
version = "0.0.0"
# without this uv derives requires-python from whichever interpreter runs it,
# so `uv lock` under python 3.14 (e.g. dependabot) resolves for >=3.14 and fails
# on wheel-only packages such as backports-zstd that have no cp314 wheels
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.31.0",
  "backports-zstd>=1.3.0",
  "beautifulsoup4>=4.7.1",
  "boto3>=1.34.128",
  "botocore>=1.34.128",
  "brotli>=1.2.1",
  "cachetools>=5.3.0",
  "click>=8.2.1",
  "confluent-kafka>=2.8.0",
  "cronsim>=2.6",
  "cryptography>=50.0.0",
  "cssselect>=1.0.3",
  "datadog>=0.49.1",
  "django>=5.2.15",
  "django-crispy-forms>=1.14.0",
  "django-csp>=3.8",
  "django-pg-zero-downtime-migrations>=0.18",
  "djangorestframework>=3.18.2",
  "drf-spectacular>=0.27.2",
  "emmett55>=1.3.0",
  "emmett-prometheus>=0.3.0",
  "emmett-sentry>=0.10.0",
  "fido2>=0.9.2",
  "google-api-core>=2.19.1",
  "google-auth>=2.29.0",
  "google-cloud-bigtable>=2.30.1",
  "google-cloud-build>=3.24.2",
  "google-cloud-core>=2.4.1",
  "google-cloud-functions>=1.17.0",
  "google-cloud-kms>=2.24.2",
  "google-cloud-logging>=3.10.0",
  "google-cloud-pubsub>=2.23.0",
  "google-cloud-spanner>=3.49.0",
  "google-cloud-storage>=2.18.0",
  "google-cloud-storage-transfer>=1.17.0",
  "google-crc32c>=1.6.0",
  "google-re2>=1.1.20251105",
  "googleapis-common-protos>=1.63.2",
  "granian[pname,reload,uvloop]>=2.8",
  "grpc-google-iam-v1>=0.13.1",
  # Note, grpcio>1.30.0 requires setting GRPC_POLL_STRATEGY=epoll1
  # See https://github.com/grpc/grpc/issues/23796 and
  # https://github.com/grpc/grpc/blob/v1.35.x/doc/core/grpc-polling-engines.md#polling-engine-implementations-in-grpc
  "grpcio>=1.84.1",
  # not directly used, but provides a speedup for redis
  "hiredis>=2.3.2",
  "jsonschema>=4.20.0",
  "lxml>=6.1.0",
  "maxminddb>=2.3.0",
  "mistune>=3.3.0",
  "mmh3>=4.0.0",
  "msgspec>=0.19.0",
  "msgpack>=1.2.3",
  "objectstore-client>=0.3.0",
  "orjson>=3.10.10",
  "packaging>=24.1",
  "parsimonious>=0.10.0",
  "petname>=2.6",
  "phonenumberslite>=8.12.55",
  "pillow>=13.0.0",
  "proto-plus>=1.25.0",
  "protobuf>=5.29.6",
  "psutil>=5.9.7",
  "psycopg2-binary>=2.9.10",
  "punkreq>=0.2.3",
  "pydantic>=1.10.26,<2",
  "pymemcache>=4.0.0",
  "pyjwt>=2.13.0",
  "python-dateutil>=2.9.0.post0",
  "python-rapidjson>=1.8",
  "python-u2flib-server>=5.0.0",
  "python3-saml>=1.15.0",
  "rb>=1.11.0",
  "redis>=3.4.1",
  "redis-py-cluster>=2.1.0",
  "requests>=2.33.0",
  "requests-oauthlib>=1.2.0",
  # [start] jsonschema format validators
  "rfc3339-validator>=0.1.2",
  "rfc3986-validator>=0.1.1",
  # [end] jsonschema format validators
  "sentry-arroyo>=2.47.0",
  "sentry-conventions>=0.30.0",
  "sentry-forked-email-reply-parser>=0.5.12.post1",
  "sentry-kafka-schemas>=3.0.2",
  "sentry-ophio>=1.3.1",
  # sentry-options is only used in getsentry for now
  "sentry-options>=1.2.15",
  "sentry-protos>=0.99.0",
  "sentry-redis-tools>=0.5.0",
  "sentry-viewercontext>=0.2.0",
