  "cssselect>=1.0.3",
  "datadog>=0.49.1",
  "django>=5.2.15",
  "django-crispy-forms>=1.14.0",
  "django-csp>=3.8",
  "django-pg-zero-downtime-migrations>=0.18",
  "djangorestframework>=3.18.2",
  "drf-spectacular>=0.27.2",
  "emmett55>=1.3.0",
  "emmett-prometheus>=0.3.0",
  "emmett-sentry>=0.10.0",
  "fido2>=0.9.2",
