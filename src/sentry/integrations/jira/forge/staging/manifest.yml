# Forge-native staging app for testing the Forge migration against production
# sentry.io. Register it with `forge register` (which fills in app.id), add that ID
# to both the `jira.forge.app-ids` and `jira.forge.native-app-ids` options (it has
# no Connect predecessor), then `forge deploy` and `forge install` it on a test site
# that doesn't also have the production Connect app.
app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x
remotes:
  - key: sentry
    baseUrl: https://sentry.io
modules:
  trigger:
    - key: installation
      endpoint: installation-endpoint
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  scheduledTrigger:
    # Forge only sends tokens when it calls us, and each one is valid for at least
    # 2 hours, so this keeps a usable token stored for background API calls.
    - key: token-refresh
      endpoint: installation-endpoint
      interval: hour
  endpoint:
    - key: installation-endpoint
      remote: sentry
      route:
        path: /extensions/jira/forge/installation/
      auth:
        appSystemToken:
          enabled: true
permissions:
  scopes:
    - read:app-system-token
    - read:jira-work
    - read:jira-user
    - read:email-address:jira
    # Granular write scopes instead of write:jira-work, which maps to the Connect
    # DELETE scope the Connect app never had, so every site admin would have to approve
    # the update. Each write call needs its whole granular set, reads included.
    - write:issue:jira
    - write:issue.property:jira
    - write:comment:jira
    - write:comment.property:jira
    - write:attachment:jira
    - read:issue:jira
    - read:comment:jira
    - read:comment.property:jira
    - read:project:jira
    - read:project-role:jira
    - read:user:jira
    - read:group:jira
    - read:avatar:jira
    # Project status lookups for the status-sync settings. The classic scope for them
    # (manage:jira-configuration) maps to Connect ADMIN; this one maps to READ.
    - read:workflow:jira
