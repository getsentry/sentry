{% load sentry_assets %}
{% load sentry_trace %}

<meta name="sentry-trace" content="{% get_sentry_trace %}">
<meta name="baggage" content="{% get_sentry_baggage %}">

{% script %}
<script type="text/javascript">
  function __preloadData() {
    if (!window.__initialData.shouldPreloadData) {
      return;
    }
    var slug = window.__initialData.lastOrganization;
    if (!slug && window.__initialData.customerDomain) {
      slug = window.__initialData.customerDomain.subdomain;
    }
    var host = '';
    if (window.__initialData.links && window.__initialData.links.regionUrl !== window.__initialData.links.sentryUrl) {
      host = window.__initialData.links.regionUrl;
    }

    async function promiseRequest(url) {
      // Network and JSON parse failures reject with their original errors
      const response = await fetch(url, {
        method: 'GET',
        headers: {
          Accept: 'application/json; charset=utf-8',
          'Content-Type': 'application/json',
          'sentry-trace': window.__initialData.initialTrace.sentry_trace,
          'baggage': window.__initialData.initialTrace.baggage,
        },
        credentials: 'include',
        priority: 'high',
      });
      if (response.status >= 200 && response.status < 300) {
        const text = await response.text();
        const json = JSON.parse(text);
        // Matching ResponseMeta from api
        const responseMeta = {
          status: response.status,
          statusText: response.statusText,
          responseJSON: json,
          responseText: text,
          getResponseHeader: (header) => response.headers.get(header),
        };
        return [json, response.statusText, responseMeta];
      }
      const error = new Error(
        'Preload request failed with status ' + response.status + ' ' + response.statusText
      );
      error.name = 'PreloadRequestError';
      error.status = response.status;
      error.statusText = response.statusText;
      throw error;
    }

    function makeUrl(suffix) {
      return host + '/api/0/organizations/' + slug + suffix;
    }

    var preloadPromises = {orgSlug: slug};
    window.__sentry_preload = preloadPromises;

    // The SDK is not loaded yet, so record each request's outcome for the app
    // to report as metrics once it initializes. Handling the rejection here
    // also keeps failed requests from surfacing as unhandled rejections; the
    // bootstrap queries still receive the rejected request promise.
    var preloadResults = {};
    window.__sentry_preload_results = preloadResults;

    function trackRequest(name, url) {
      var startTime = performance.now();
      var promise = promiseRequest(url);
      preloadResults[name] = promise.then(
        (result) => ({
          outcome: 'success',
          status: result[2].status,
          durationMs: performance.now() - startTime,
        }),
        (error) => ({
          outcome: 'error',
          status: error.status,
          errorName: error.name,
          durationMs: performance.now() - startTime,
        })
      );
      return promise;
    }

    if (!slug) {
      return;
    }

    preloadPromises.organization = trackRequest(
      'organization',
      makeUrl('/?detailed=0&include_feature_flags=1')
    );
    preloadPromises.projects = trackRequest(
      'projects',
      makeUrl('/projects/?all_projects=1&collapse=latestDeploys&collapse=unusedFeatures')
    );
    preloadPromises.teams = trackRequest('teams', makeUrl('/teams/'));
  }

  try {
    __preloadData();
  } catch (_) {}
</script>
{% endscript %}
